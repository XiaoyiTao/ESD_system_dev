spring:
  cloud:
    nacos:
      discovery:
        # 本地無 Nacos 時關閉服務註冊；接入環境後由環境變量打開。
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        enabled: false

esd:
  # 僅本地聯調可使用 X-ESD-Debug-* 請求頭，生產必須保持 false。
  local-debug-auth-enabled: ${ESD_LOCAL_DEBUG_AUTH_ENABLED:false}
