server:
  # ESD 業務服務端口；前端開發代理默認指向該端口。
  port: 48082

spring:
  application:
    name: platform-esd-server
  profiles:
    active: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    # 獨立業務庫，不保存 platform-system 的帳號、密碼和組織主數據。
    url: ${ESD_DB_URL:jdbc:mysql://127.0.0.1:3306/platform_esd?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${ESD_DB_USERNAME:root}
    password: ${ESD_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

esd:
  # 生產環境可通過環境變量或 Nacos 覆蓋服務發現和調試配置。
  service-name: ${spring.application.name}
  platform-system-service: ${ESD_PLATFORM_SYSTEM_SERVICE:platform-system-server}
  local-debug-auth-enabled: false
